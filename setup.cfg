[metadata]
name = tgf_autosearch
version = 1.0.2
summary = An application for automatically running searches of new UCSC TGF Group data.
home_page = https://github.com/JSheare/tgf_autosearch
author = Jacob Shearer
author_email = jacob.shearer6912@gmail.com


[options]
packages = 
	tgf_autosearch
    tgf_autosearch/config
	tgf_autosearch/helpers
    tgf_autosearch/startup
    tgf_autosearch/validation
python_requires = >=3.10
install_requires =
    platformdirs
    psutil
    pydantic
    pyyaml
    tgfsearch@git+https://github.com/JSheare/tgfsearch

[options.entry_points]
console_scripts =
    tgf-autosearch = tgf_autosearch.main:main

[options.package_data]
tgf_autosearch =
    config/*.yaml
	